<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" href="/fonts/raleway-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>EJKA Quiz</title>
    <script>(function(){var t=null;try{t=localStorage.getItem('quiz_ui_theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.dataset.theme=t;
var l=null;try{l=sessionStorage.getItem('quiz_ui_language')}catch(e){}
if(location.pathname.indexOf('/admin')!==0&&['en','de','he','ru'].indexOf(l)>=0){document.documentElement.lang=l;if(l==='he')document.documentElement.dir='rtl'}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
